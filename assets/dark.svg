  </text>

  <rect x="272" y="488" width="7" height="12" fill="#22D3EE">
    <animate attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>
  </rect>

  <text x="78" y="518"
        fill="#475569"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="9">
