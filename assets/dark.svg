<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" fill="none">
<defs>

  <!-- CORE BACKGROUND -->
  <linearGradient id="bg" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
    <stop stop-color="#010308"/>
    <stop offset=".48" stop-color="#030711"/>
    <stop offset="1" stop-color="#010208"/>
  </linearGradient>

  <!-- CYBER GRADIENT -->
  <linearGradient id="cyber" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
    <stop stop-color="#8B5CF6"/>
    <stop offset=".38" stop-color="#22D3EE"/>
    <stop offset=".7" stop-color="#06B6D4"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>

  <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#22D3EE"/>
    <stop offset=".5" stop-color="#67E8F9"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>

  <!-- AMBIENT GLOWS -->
  <radialGradient id="violetGlow">
    <stop stop-color="#7C3AED" stop-opacity=".30"/>
    <stop offset=".55" stop-color="#7C3AED" stop-opacity=".08"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="cyanGlow">
    <stop stop-color="#06B6D4" stop-opacity=".24"/>
    <stop offset=".55" stop-color="#06B6D4" stop-opacity=".06"/>
    <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#08111D" stop-opacity=".96"/>
    <stop offset="1" stop-color="#030812" stop-opacity=".94"/>
  </linearGradient>

  <!-- GRID -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#22D3EE" stroke-opacity=".055"/>
  </pattern>

  <!-- MICRO DOTS -->
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="4" r=".7" fill="#67E8F9" opacity=".11"/>
    <circle cx="20" cy="27" r=".5" fill="#A78BFA" opacity=".09"/>
  </pattern>

  <!-- GLOW -->
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <clipPath id="clip">
    <rect width="1180" height="610" rx="30"/>
  </clipPath>

</defs>

<g clip-path="url(#clip)">

  <!-- BACKGROUND -->
  <rect width="1180" height="610" fill="url(#bg)"/>
  <rect width="1180" height="610" fill="url(#grid)"/>
  <rect width="1180" height="610" fill="url(#dots)"/>

  <!-- AMBIENT LIGHT -->
  <circle cx="180" cy="80" r="270" fill="url(#violetGlow)" filter="url(#softGlow)">
    <animateTransform attributeName="transform"
      type="translate"
      values="0 0;80 30;0 0"
      dur="12s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1030" cy="520" r="280" fill="url(#cyanGlow)" filter="url(#softGlow)">
    <animateTransform attributeName="transform"
      type="translate"
      values="0 0;-70 -35;0 0"
      dur="15s"
      repeatCount="indefinite"/>
  </circle>

  <!-- TOP STATUS BAR -->
  <rect x="28" y="24" width="1124" height="42" rx="12"
        fill="#050A12"
        stroke="#22D3EE"
        stroke-opacity=".18"/>

  <circle cx="52" cy="45" r="5" fill="#22D3EE" filter="url(#glow)">
    <animate attributeName="opacity"
      values=".35;1;.35"
      dur="1.8s"
      repeatCount="indefinite"/>
  </circle>

  <text x="68" y="50"
        fill="#67E8F9"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="12"
        font-weight="700"
        letter-spacing="2">
    SUDHEER.SEC // CYBER OPERATIONS NODE
  </text>

  <text x="920" y="50"
        fill="#64748B"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="10"
        letter-spacing="1.5">
    SYSTEM: ONLINE
  </text>

  <circle cx="1106" cy="45" r="4" fill="#10B981">
    <animate attributeName="r"
      values="3;5;3"
      dur="1.6s"
      repeatCount="indefinite"/>
  </circle>

  <!-- LEFT IDENTITY PANEL -->
  <rect x="28" y="82" width="390" height="500" rx="22"
        fill="url(#panel)"
        stroke="#FFFFFF"
        stroke-opacity=".08"/>

  <rect x="42" y="96" width="362" height="472" rx="17"
        fill="none"
        stroke="url(#cyber)"
        stroke-opacity=".16"/>

  <!-- IDENTITY LABEL -->
  <text x="64" y="124"
        fill="#64748B"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="10"
        letter-spacing="2">
    IDENTITY / ACCESS PROFILE
  </text>

  <!-- ASCII / CYBER CORE -->
  <g transform="translate(62 154)"
     font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
     fill="url(#terminal)"
     filter="url(#strongGlow)">

    <text x="0" y="0" font-size="11">&gt; INITIALIZING SECURITY PROFILE...</text>
    <text x="0" y="23" font-size="11">&gt; AUTH: VERIFIED</text>
    <text x="0" y="46" font-size="11">&gt; ROLE: CYBERSECURITY</text>

    <text x="0" y="82" font-size="12" font-weight="700">
      ┌─────────────────────────────┐
    </text>
    <text x="0" y="100" font-size="12" font-weight="700">
      │        S U D H E E R        │
    </text>
    <text x="0" y="118" font-size="12" font-weight="700">
      │        S E C . O P S        │
    </text>
    <text x="0" y="136" font-size="12" font-weight="700">
      └─────────────────────────────┘
    </text>
  </g>

  <!-- NAME -->
  <text x="62" y="326"
        fill="#F8FAFC"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="25"
        font-weight="800"
        letter-spacing="1">
    SUDHEER
  </text>

  <text x="62" y="350"
        fill="#22D3EE"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="11"
        font-weight="700"
        letter-spacing="2">
    CYBERSECURITY // SOC // DFIR
  </text>

  <!-- PROFILE METRICS -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">

    <rect x="62" y="376" width="155" height="55" rx="10"
          fill="#07111B"
          stroke="#22D3EE"
          stroke-opacity=".12"/>

    <text x="77" y="398" fill="#64748B" font-size="9" letter-spacing="1.2">
      PRIMARY FOCUS
    </text>
    <text x="77" y="417" fill="#E2E8F0" font-size="11" font-weight="700">
      THREAT DETECTION
    </text>

    <rect x="227" y="376" width="155" height="55" rx="10"
          fill="#07111B"
          stroke="#8B5CF6"
          stroke-opacity=".14"/>

    <text x="242" y="398" fill="#64748B" font-size="9" letter-spacing="1.2">
      OPERATIONS
    </text>
    <text x="242" y="417" fill="#E2E8F0" font-size="11" font-weight="700">
      SOC / DFIR
    </text>

  </g>

  <!-- TERMINAL PROMPT -->
  <rect x="62" y="452" width="320" height="76" rx="12"
        fill="#02050A"
        stroke="#22D3EE"
        stroke-opacity=".14"/>

  <text x="78" y="476"
        fill="#10B981"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="10">
