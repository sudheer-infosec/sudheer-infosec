  <circle cx="1098" cy="119" r="6" fill="#10B981" filter="url(#glow)">
    <animate attributeName="opacity"
      values=".35;1;.35"
      dur="1.5s"
      repeatCount="indefinite"/>
  </circle>

  <!-- THREAT STATUS -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">

    <rect x="454" y="172" width="212" height="104" rx="14"
          fill="#061018"
          stroke="#22D3EE"
          stroke-opacity=".18"/>

    <text x="472" y="195" fill="#64748B" font-size="9" letter-spacing="1.5">
      THREAT MONITOR
    </text>

    <text x="472" y="227"
          fill="#22D3EE"
          font-size="27"
          font-weight="800"
          filter="url(#glow)">
      ACTIVE
    </text>

    <text x="472" y="252" fill="#94A3B8" font-size="9">
      detection engine operational
    </text>

    <rect x="472" y="260" width="150" height="2" rx="1" fill="#0F2730"/>
    <rect x="472" y="260" width="112" height="2" rx="1" fill="#22D3EE">
      <animate attributeName="width"
        values="80;140;112;125;112"
        dur="4s"
        repeatCount="indefinite"/>
    </rect>


    <rect x="682" y="172" width="212" height="104" rx="14"
          fill="#080914"
          stroke="#8B5CF6"
          stroke-opacity=".20"/>

    <text x="700" y="195" fill="#64748B" font-size="9" letter-spacing="1.5">
      ANALYSIS ENGINE
    </text>

    <text x="700" y="227"
          fill="#A78BFA"
          font-size="27"
          font-weight="800"
          filter="url(#glow)">
      DFIR
    </text>

    <text x="700" y="252" fill="#94A3B8" font-size="9">
      evidence • timeline • artifacts
    </text>

    <rect x="700" y="260" width="150" height="2" rx="1" fill="#211A35"/>
    <rect x="700" y="260" width="96" height="2" rx="1" fill="#8B5CF6">
      <animate attributeName="width"
        values="70;125;96;115;96"
        dur="4.5s"
        repeatCount="indefinite"/>
    </rect>


    <rect x="910" y="172" width="226" height="104" rx="14"
          fill="#06100F"
          stroke="#10B981"
          stroke-opacity=".18"/>

    <text x="928" y="195" fill="#64748B" font-size="9" letter-spacing="1.5">
      SECURITY STACK
    </text>

    <text x="928" y="225"
          fill="#34D399"
          font-size="13"
          font-weight="700">
      WAZUH  •  SURICATA
    </text>

    <text x="928" y="246"
          fill="#CBD5E1"
          font-size="10">
      SIEM  •  IDS  •  LOGS
    </text>

    <text x="928" y="265"
          fill="#475569"
          font-size="8">
      WINDOWS / LINUX / KALI
    </text>

  </g>

  <!-- EVENT STREAM -->
  <rect x="454" y="294" width="430" height="268" rx="14"
        fill="#02060B"
        stroke="#FFFFFF"
        stroke-opacity=".07"/>

  <text x="474" y="320"
        fill="#64748B"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="9"
        letter-spacing="1.6">
    EVENT STREAM / SECURITY LOG
  </text>

  <line x1="474" y1="333" x2="864" y2="333"
        stroke="#FFFFFF" stroke-opacity=".06"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
     font-size="9">

    <text x="474" y="357" fill="#475569">09:41:02</text>
    <text x="548" y="357" fill="#22D3EE">SSH</text>
    <text x="592" y="357" fill="#CBD5E1">invalid authentication event</text>
    <circle cx="846" cy="353" r="4" fill="#F59E0B"/>

    <text x="474" y="390" fill="#475569">09:41:18</text>
    <text x="548" y="390" fill="#A78BFA">DFIR</text>
    <text x="592" y="390" fill="#CBD5E1">artifact indexed</text>
    <circle cx="846" cy="386" r="4" fill="#8B5CF6"/>

    <text x="474" y="423" fill="#475569">09:42:07</text>
    <text x="548" y="423" fill="#10B981">SYS</text>
    <text x="592" y="423" fill="#CBD5E1">endpoint heartbeat received</text>
    <circle cx="846" cy="419" r="4" fill="#10B981"/>

    <text x="474" y="456" fill="#475569">09:42:44</text>
    <text x="548" y="456" fill="#22D3EE">SIEM</text>
    <text x="592" y="456" fill="#CBD5E1">correlation rule triggered</text>
    <circle cx="846" cy="452" r="4" fill="#22D3EE"/>

    <text x="474" y="489" fill="#475569">09:43:11</text>
    <text x="548" y="489" fill="#F59E0B">ALRT</text>
    <text x="592" y="489" fill="#CBD5E1">suspicious activity flagged</text>
    <circle cx="846" cy="485" r="4" fill="#F59E0B"/>

    <text x="474" y="522" fill="#475569">09:43:39</text>
    <text x="548" y="522" fill="#10B981">SOC</text>
    <text x="592" y="522" fill="#CBD5E1">analyst workflow ready</text>
    <circle cx="846" cy="518" r="4" fill="#10B981"/>

  </g>

  <!-- SKILL MATRIX -->
  <rect x="902" y="294" width="234" height="268" rx="14"
        fill="#050910"
        stroke="#FFFFFF"
        stroke-opacity=".07"/>

  <text x="922" y="320"
        fill="#64748B"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="9"
        letter-spacing="1.6">
