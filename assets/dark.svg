  </text>

  <!-- RIGHT COMMAND CENTER -->
  <rect x="438" y="82" width="714" height="500" rx="22"
        fill="url(#panel)"
        stroke="#FFFFFF"
        stroke-opacity=".08"/>

  <!-- PANEL HEADER -->
  <rect x="454" y="98" width="682" height="58" rx="14"
