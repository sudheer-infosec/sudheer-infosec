    <text x="922" y="353" fill="#E2E8F0">SOC / SIEM</text>
    <rect x="922" y="362" width="180" height="4" rx="2" fill="#0F1D29"/>
    <rect x="922" y="362" width="154" height="4" rx="2" fill="#22D3EE"/>

    <text x="922" y="397" fill="#E2E8F0">THREAT DETECTION</text>
    <rect x="922" y="406" width="180" height="4" rx="2" fill="#0F1D29"/>
    <rect x="922" y="406" width="143" height="4" rx="2" fill="#8B5CF6"/>

    <text x="922" y="441" fill="#E2E8F0">DIGITAL FORENSICS</text>
    <rect x="922" y="450" width="180" height="4" rx="2" fill="#0F1D29"/>
    <rect x="922" y="450" width="161" height="4" rx="2" fill="#10B981"/>

    <text x="922" y="485" fill="#E2E8F0">NETWORK SECURITY</text>
    <rect x="922" y="494" width="180" height="4" rx="2" fill="#0F1D29"/>
    <rect x="922" y="494" width="137" height="4" rx="2" fill="#22D3EE"/>

    <text x="922" y="529" fill="#E2E8F0">ETHICAL HACKING</text>
    <rect x="922" y="538" width="180" height="4" rx="2" fill="#0F1D29"/>
    <rect x="922" y="538" width="148" height="4" rx="2" fill="#A78BFA"/>

  </g>

  <!-- MOVING CYBER SCANNER -->
  <rect x="438" y="82" width="3" height="500"
        fill="#22D3EE"
        opacity=".18">
    <animate attributeName="x"
